<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>BongExtend 최근 다운로드</title><link rel="stylesheet" href="/theme/theme.css"><link rel="stylesheet" href="/recent-downloads.css"><script defer src="/recent-downloads.js"></script></head>
<body class="be-page"><header><strong>다운로더</strong><nav aria-label="선택한 다운로드 작업"><button id="add">＋ 추가</button><button id="resume">이어받기</button><button id="pause">일시정지</button><button id="retry">다시 받기</button><button id="trash">휴지통</button><button id="restore" hidden>복원</button><button id="settings">설정</button></nav><button id="expand">↗ 크게 보기</button><input id="search" type="search" aria-label="다운로드 검색" placeholder="파일·주소 검색"></header>
<main><aside aria-label="다운로드 분류"><button data-filter="all">모든 작업</button><button data-filter="recent" class="selected">최근</button><button data-filter="active">다운로드 중</button><button data-filter="complete">완료</button><button data-filter="images" class="category">이미지</button><button data-filter="video" class="category">동영상</button><button data-filter="audio" class="category">오디오</button><button data-filter="documents" class="category">문서</button><button data-filter="archives" class="category">압축 파일</button><button data-filter="other" class="category">기타</button><button data-filter="failed">실패</button><button data-filter="trash">휴지통</button></aside>
<div class="table-wrap" aria-label="다운로드 표 · 가로로 스크롤하면 모든 열을 볼 수 있어요"><table><thead><tr><th><input id="selectAll" type="checkbox" aria-label="표시된 항목 모두 선택"></th><th>상태</th><th>파일 이름</th><th>진행</th><th>파일 크기</th><th>속도</th><th>남은 시간</th><th>URL</th></tr></thead><tbody id="rows"></tbody></table><p id="empty" hidden>이 분류에 다운로드가 없어요.</p></div></main>
<footer><span id="count">기록을 가져오고 있어요…</span><button id="more" hidden>200개 더 보기</button><span id="notice" role="status"></span><span>최근: 3일 이내</span></footer>
<dialog id="addDialog"><form id="addForm"><h2>다운로드 추가</h2><label>파일 주소<input id="newUrl" type="url" required placeholder="https://…"></label><div><button type="button" id="closeDialog">취소</button><button class="primary">다운로드</button></div></form></dialog></body></html>

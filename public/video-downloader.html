<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>BongExtend 동영상 받기</title><link rel="stylesheet" href="/theme/theme.css"><link rel="stylesheet" href="/video-downloader.css"><script defer src="/video-downloader.js"></script></head><body class="be-page"><main class="be-card">
<h1>동영상 받기</h1><p>PC에서 직접 다운로드해요. 별도 API 키는 필요하지 않아요.</p>
<form id="videoForm"><label>영상 주소<input id="videoUrl" type="url" placeholder="영상 페이지 또는 영상 파일 주소" required></label><label>화질<select id="quality"><option value="2160">최대 4K</option><option value="1440">최대 1440p</option><option value="1080">최대 1080p</option><option value="720">최대 720p</option><option value="audio">오디오 MP3</option></select></label><button class="primary" id="start">다운로드</button><button type="button" id="cancel">중단</button></form>
<p id="status" role="status">보조 프로그램을 확인하고 있어요…</p><progress id="progress" max="100" value="0"></progress><p id="file"></p>
<details id="setup"><summary>처음 한 번 연결하기</summary><ol><li><button id="connection" type="button">연결 파일 받기</button></li><li><a id="installer" target="_blank" rel="noopener">Windows 보조 프로그램 받기</a> → 압축을 풀고 <b>install.cmd</b>를 실행해요. Python 3.10 이상이 필요해요.</li><li><button id="connect" type="button">연결 확인</button></li></ol><p>설치 시 공식 yt-dlp·FFmpeg를 내려받아요. 파일은 다운로드 폴더의 BongExtend 안에 저장해요. 제공되는 화질까지만 받을 수 있고, 로그인이나 사이트 제한으로 받지 못하는 영상도 있어요.</p></details>
</main></body></html>

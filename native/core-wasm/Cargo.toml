[package]
name = "bongextend-core"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-only"
description = "BongExtend rule/parsing logic in Rust (downloads, mail, update checks, shop), built to WebAssembly. Each function matches the old JavaScript exactly or answers 'fallback'."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
memchr = "2"
miniz_oxide = "0.8"
unicode-script = { version = "0.5.9", optional = true }
url = { version = "2.5.8", optional = true }

[features]
# 이식 실험(extra.rs): 배포 엔진에는 넣지 않아요. 시험: cargo test --features experiments
experiments = ["dep:url", "dep:unicode-script"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="/theme/theme.css">
<style>
body{padding:14px 16px}
.head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.head h3{margin:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
.col{display:flex;flex-direction:column;gap:10px}
.be-card{padding:4px 14px 8px}
.be-card h4{margin:8px 0 2px}
label{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:30px;margin:0;color:var(--be-text-2)}
label+label{border-top:1px solid rgba(255,255,255,.035)}
label.is-disabled{opacity:.45}
label.sub{padding-left:14px;border-top:0;font-size:.95em}
.hint{margin:0 0 6px;color:var(--be-muted);font-size:11px;line-height:1.5;word-break:keep-all}
input[type=number]{width:64px;text-align:right}
select{min-width:76px}
.inline{display:flex;align-items:center;gap:6px}
.inline b{min-width:28px;text-align:right;color:var(--be-text);font-weight:600}
.watch-row{display:flex;gap:6px;margin-top:6px}
.watch-row input{flex:1;min-width:0}
#watchMsg{color:var(--be-muted);margin:6px 0 0;font-size:12px;min-height:1em}
#watchListEl{list-style:none;padding:0;margin:4px 0 0;font-size:12px}
.c{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--be-muted)}
.c b{color:var(--be-text)}
#last{flex-basis:100%;font-size:12px}
#updateStatus{color:var(--be-muted);margin:6px 0;word-break:keep-all}
#updateStatus.error{color:var(--be-error)}
/* Module layout: the app theme owns the light/dark glass palette. */
body{margin:0;background:var(--be-canvas-gradient,var(--be-bg));min-width:0}
.be-title{padding:0 0 12px;margin-bottom:12px;border-bottom:1px solid var(--be-glass-border,var(--be-border));gap:8px;flex-wrap:wrap}
.be-title h3{font-size:17px;letter-spacing:-.5px}
.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.col{min-width:0;gap:12px}
.be-card{padding:10px 14px 12px;border-radius:16px;background:var(--be-glass,var(--be-surface));border:1px solid var(--be-glass-border,var(--be-border));box-shadow:var(--be-glass-shadow,none)}
.be-card h4{font-size:12px;letter-spacing:0;color:var(--be-text-2);margin:2px 0 6px;padding-bottom:9px;border-bottom:1px solid var(--be-border)}
label{padding:7px 0;line-height:1.5;min-width:0;overflow-wrap:anywhere}
label>input,label>select{flex-shrink:0}
.inline{justify-content:flex-end;flex-wrap:wrap;min-width:0;max-width:65%}
.inline input[type=range]{max-width:100%}
input[type=number],select,button{background:var(--be-control-bg,var(--be-surface-2));border-color:var(--be-control-border,var(--be-border-strong));border-radius:9px}
.watch-row{flex-wrap:wrap;gap:8px}
.watch-row input{flex-basis:150px}
.watch-row button{max-width:100%;white-space:normal}
.hint{line-height:1.6;margin:2px 0 8px;overflow-wrap:anywhere}
.c{margin-top:8px;padding-top:8px;border-top:1px solid var(--be-border)}
#watchListEl{overflow-wrap:anywhere}
@media(max-width:600px){.grid{grid-template-columns:minmax(0,1fr)}}
@media(max-width:360px){body{padding:12px}.be-card{padding:10px 12px}label{flex-wrap:wrap}label>input,label>select,.inline{margin-left:auto}.inline{max-width:100%}}
</style>
</head><body class="be-page">
<div class="be-title"><h3>치지직</h3><span class="be-sub">라이브 시청 편의 기능</span></div>
<div class="grid be-grid">
<div class="col">
<section class="be-card">
<h4>버퍼링 복구</h4>
<label>자동 복구 사용<input type="checkbox" id="enabled"></label>
<label>버퍼링으로 볼 시간(초)<input type="number" id="threshold" min="2" max="60"></label>
<label>복구 사이 간격(초)<input type="number" id="cooldown" min="3" max="120"></label>
<label>복구할 때 화면에 알림<input type="checkbox" id="toast"></label>
<label title="버퍼링이 걸리면 다음 복구까지 남은 시간을 영상 위에 크게 보여 줘요">버퍼링 때 복구 타이머 크게 표시<input type="checkbox" id="retryTimer"></label>
<div class="c">지금까지 복구 <b id="count">0</b>회 <button id="reset" type="button" title="복구 횟수와 마지막 복구 시각만 지워요. 설정은 그대로예요.">횟수 초기화</button><div id="last"></div></div>
</section>
<section class="be-card">
<h4>화면</h4>
<label>화질 고정 <span class="inline"><select id="targetQuality" aria-label="고정할 화질"><option value="1080">1080p</option><option value="720">720p</option><option value="480">480p</option><option value="360">360p</option></select><input type="checkbox" id="lockQuality" aria-label="화질 고정"></span></label>
<label>방송에 들어가면 넓은 화면으로<input type="checkbox" id="autoWide"></label>
<label>넓은 화면에서 Chrome도 전체화면으로<input type="checkbox" id="wideFullscreen"></label>
<p class="hint">F11처럼 브라우저 테두리를 숨겨요. 넓은 화면을 끄거나 다른 탭으로 이동하면 이전 창 상태로 돌아와요.</p>
<label>들어가거나 새로고침하면 자동 재생<input type="checkbox" id="autoPlay"></label>
<label>선명한 화면 항상 켜기<input type="checkbox" id="vivid"></label>
<label title="'실시간' 버튼을 눌렀을 때 뜨는 치트키·타임머신 안내창을 자동으로 닫아요">치트키 안내창 숨기기<input type="checkbox" id="hideTimeGuide"></label>
<label title="시작·중간 영상 광고와 배너를 처음부터 막아요. 끄거나 켠 뒤에는 보고 있는 방송을 새로고침해 주세요">광고 차단<input type="checkbox" id="adBlock"></label>
<label title="막히지 않은 광고에 건너뛰기 버튼이 나오면 대신 눌러요">광고 자동 건너뛰기<input type="checkbox" id="adSkip"></label>
<label>영상 위에 시청자 수 표시<input type="checkbox" id="viewerOverlay"></label>
</section>
<section class="be-card">
<h4>조작</h4>
<label>방향키(← →)로 앞뒤 이동<input type="checkbox" id="arrowSeek"></label>
<label class="sub">이동 간격<select id="seekSeconds"><option value="5">5초</option><option value="10">10초</option><option value="15">15초</option><option value="30">30초</option></select></label>
</section>
</div>
<div class="col">
<section class="be-card">
<h4>채팅</h4>
<label>통나무 파워 자동 받기<input type="checkbox" id="autoLogPower"></label>
<p class="hint">시청 보상의 받기 버튼이 뜨면 자동으로 눌러요.</p>
<label>채팅창 제목 옆에 시청자 수 표시<input type="checkbox" id="viewerChat"></label>
<label>주간 랭킹 가리기<input type="checkbox" id="hideRanking"></label>
<label>후원 랭킹 닉네임 흐리게<input type="checkbox" id="blurRankNames"></label>
<p class="hint" id="blurRankHint" hidden>주간 랭킹을 가리는 중이라 쓸 수 없어요. 주간 랭킹 가리기를 끄면 켤 수 있어요.</p>
<label>채팅 글씨 크기 <span class="inline"><input type="range" id="chatFontSize" min="12" max="28" step="1" style="width:90px"> <b id="chatFontLabel">기본</b> <button id="chatFontReset" type="button" title="채팅 글씨 크기를 원래대로">되돌리기</button></span></label>
</section>
<section class="be-card">
<h4>팔로잉</h4>
<label>팔로잉 목록 자동 새로고침<input type="checkbox" id="followRefresh"></label>
<label class="sub">새로고침 간격<select id="followInterval"><option value="5">5초</option><option value="10">10초</option><option value="30">30초</option><option value="60">60초</option></select></label>
</section>
<section class="be-card">
<h4>관심 스트리머 자동 이동</h4>
<label>방송을 켜면 바로 이동<input type="checkbox" id="watchEnabled"></label>
<div class="watch-row"><input id="watchInput" placeholder="채널 주소 또는 ID"><button id="watchAdd" type="button" class="primary">추가</button></div>
<div class="watch-row"><button id="watchCurrent" type="button">보고 있는 채널 추가</button><button id="watchGoNow" type="button">방송 중인 채널로 이동</button></div>
<p id="watchMsg"></p>
<ul id="watchListEl"></ul>
</section>
</div>
</div>
<script src="lib/ns.js"></script>
<script src="lib/watch.js"></script>
<script type="module" src="popup.js"></script></body></html>

<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BongExtend 번역</title>
    <link rel="stylesheet" href="/theme/theme.css">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body class="be-page be-shell">
    <div class="be-title">
      <h3>번역</h3>
      <span class="be-sub" id="meta">Gemini</span>
    </div>
    <div class="be-grid">
      <div class="be-col">
        <section class="be-card be-sec">
          <h4>이 페이지 번역</h4>
          <label class="be-row switch">
            <span class="be-row-text">
              <span>페이지 번역 <strong id="switchState">꺼짐</strong></span>
              <small>이 페이지만 켜고 끌 수 있어요. 항상 번역 목록은 바꾸지 않아요</small>
            </span>
            <input id="enabled" type="checkbox" role="switch" aria-label="번역">
          </label>
          <label class="be-row switch">
            <span class="be-row-text"><span>이 사이트 항상 번역</span><small>페이지 번역과 따로예요. 켜면 이 사이트 권한을 묻고, 다음에 열어도 자동으로 번역해요</small></span>
            <input id="alwaysSite" type="checkbox" role="switch" aria-label="이 사이트 항상 번역">
          </label>
        </section>
        <section class="be-card be-sec">
          <h4>상태</h4>
          <p id="status" role="status"></p>
        </section>
      </div>
      <div class="be-col">
        <section class="be-card be-sec">
          <h4>번역 설정</h4>
          <div class="be-row">
            <span class="be-row-text"><span>API 키·모델·언어·캐시</span><small>새 탭에서 번역 설정을 열어요</small></span>
            <button id="options" type="button">설정 열기</button>
          </div>
          <div class="be-row">
            <span class="be-row-text"><span>번역 단축키</span><small>기본값 Ctrl+Shift+Y · 크롬에서 변경 가능</small></span>
            <button id="shortcuts" type="button">단축키 설정</button>
          </div>
        </section>
        <section class="be-card be-sec">
          <h4>사용법</h4>
          <p class="be-hint">페이지에서 오른쪽 클릭 → <b>BongExtend: 페이지 번역 켜기/끄기</b>로도 켜고 끌 수 있어요.</p>
        </section>
      </div>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>

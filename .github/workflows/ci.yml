# PR과 main 푸시에서 설치, 테스트, 크롬 빌드를 확인해요. 릴리스는 만들지 않아요.
name: CI
on:
    pull_request:
    push:
        branches:
            - main

jobs:
    check:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Setup Bun
                uses: oven-sh/setup-bun@v2
                with:
                    bun-version: "1.3.14"

            -   name: Setup Node
                uses: actions/setup-node@v4
                with:
                    node-version: 22

            -   name: Install Dependencies
                run: bun install

            -   name: Test
                run: bun run test

            -   name: Test local video host
                run: python3 -m unittest discover -s native/video -p 'test_*.py'

            # Rust 보조 프로그램: 기능 시험 + 파이썬 보조 프로그램과 답이 같은지(골든) 확인해요.
            -   name: Test Rust video host
                run: cargo test --manifest-path native/video-rs/Cargo.toml

            # 다크 모드 픽셀 보정(Rust): 기능 시험. 자바스크립트와의 결과 비교는 bun run test 의 icon-pixels.test.js 가 해요.
            -   name: Test Rust dark pixels
                run: cargo test --manifest-path native/dark-pixels/Cargo.toml

            # 규칙·분석 로직(Rust): 기능 시험. 자바스크립트와의 결과 비교는 bun run test 의 *-rust.test.js 가 해요.
            -   name: Test Rust core
                run: cargo test --manifest-path native/core-wasm/Cargo.toml

            -   name: Build
                run: bun run build

            -   name: Check built output has no eval
                run: bun scripts/check-no-eval.ts

            -   name: Check manifest permissions did not grow
                run: bun scripts/check-manifest-permissions.ts
